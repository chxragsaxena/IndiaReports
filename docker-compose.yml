# IndiaReports - local stack. `docker compose up --build`
# Each service owns its own database (same Postgres instance only for local convenience).

services:
  postgres:
    image: postgis/postgis:16-3.4
    # Several services and workers each hold a small pool; leave headroom.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # TCP check: during first-boot init only a socket-only temporary server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  report-service:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/reports_db
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_KEY: dev-admin-key
      ESCALATION_AFTER_SECONDS: ${ESCALATION_AFTER_SECONDS:-604800}
      ESCALATION_CHECK_SECONDS: ${ESCALATION_CHECK_SECONDS:-60}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # A resolved report stays on the public map this long (the reporter can check it), then leaves.
      RESOLVED_VISIBLE_SECONDS: ${RESOLVED_VISIBLE_SECONDS:-259200}
      LIFECYCLE_CHECK_SECONDS: ${LIFECYCLE_CHECK_SECONDS:-60}
      # Email to citizens (resolved) and officers (assigned). "log" prints emails to the service
      # log; use "resend" (RESEND_API_KEY) or "smtp" (SMTP_*) to really send. See README.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_FROM: ${EMAIL_FROM:-IndiaReports <onboarding@resend.dev>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Photos: S3-compatible storage (MinIO below). The public URL is what a browser
      # uses to view a photo, so it must be the host-mapped port.
      S3_ENDPOINT_URL: http://storage:8000
      S3_PUBLIC_URL: http://localhost:${STORAGE_PORT:-9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-devaccesskey}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-devsecretkey123}
      S3_REGION: us-east-1
      # Shared secret the ai-service uses to post photo findings back (see ai-service below).
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    ports:
      - "${REPORT_PORT:-8000}:8000"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started

  storage:
    # Open-source S3-compatible server for local use (in production, point the S3_*
    # settings at real S3 or Cloudflare R2 instead).
    image: zenko/cloudserver:latest
    environment:
      SCALITY_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-devaccesskey}
      SCALITY_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-devsecretkey123}
      REMOTE_MANAGEMENT_DISABLE: "1"
      # Host names the server answers to: the docker name and what a browser uses.
      ENDPOINT: storage,localhost
    ports:
      - "${STORAGE_PORT:-9000}:8000"
    volumes:
      - storage_data:/usr/src/app/localData
      - storage_meta:/usr/src/app/localMetadata

  # Optional: runs the open-source vision model locally. Start with
  #   docker compose --profile ai up -d ollama
  # then `docker compose exec ollama ollama pull qwen3-vl:4b` and set
  # ANALYSIS_BASE_URL=http://ollama:11434/v1. Needs several GB of RAM for Docker.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Looks at uploaded photos with an open-weight vision model. Stateless: its work queue is the
  # Redis event stream, and it posts findings back to the report-service over HTTP. With no model
  # configured it idles and photos are simply stored. See README, "Photos and AI analysis".
  ai-service:
    build: ./services/ai
    environment:
      REDIS_URL: redis://redis:6379/0
      REPORT_SERVICE_URL: http://report-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      S3_ENDPOINT_URL: http://storage:8000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-devaccesskey}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-devsecretkey123}
      S3_REGION: us-east-1
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANALYSIS_BASE_URL: ${ANALYSIS_BASE_URL:-}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-}
      ANALYSIS_API_KEY: ${ANALYSIS_API_KEY:-}
      PORT: "8300"
    ports:
      - "${AI_PORT:-8300}:8300"
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      storage:
        condition: service_started

  notifier:
    build: ./services/notifier
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/notifier_db?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PORT: "8100"
    ports:
      - "${NOTIFIER_PORT:-8100}:8100"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics:
    build: ./services/analytics
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/analytics_db?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PORT: "8200"
    ports:
      - "${ANALYTICS_PORT:-8200}:8200"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  storage_data:
  storage_meta:
  ollama_data:
