<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14295f" />
    <title>You are offline - IndiaReports</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14295f; color: #fff;
             font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
      main { max-width: 420px; }
      h1 { font-size: 1.5rem; margin: 0 0 12px; }
      p { line-height: 1.5; color: #d6def5; }
      button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: #fff; color: #14295f;
               font-weight: 600; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The map and your reports need a connection. Reports cannot be filed offline, so nothing you type here is lost or sent.
         Try again when you are back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
